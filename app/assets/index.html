<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naughty Night</title>
<style>
:root{--bg:#14001f;--pink:#ff2e88;--hot:#ff5f6d;--purple:#9b5cff;--gold:#ffcc4d;--text:#fff1f8;--muted:#c9a8d6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#4a0d6e 0%,#14001f 65%) fixed}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit}
.logo{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:46px;text-align:center;margin:14px 0 0;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:4px 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:linear-gradient(160deg,rgba(255,46,136,.20),rgba(155,92,255,.12));border:1px solid var(--line);border-radius:20px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile svg{width:66px;height:66px;filter:drop-shadow(0 4px 12px rgba(255,46,136,.5))}
.tile b{display:block;font-size:16px;margin-top:6px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 16px}
.ptitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:rgba(255,46,136,.22);border:1px solid rgba(255,46,136,.5);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.3);display:inline-grid;place-items:center;cursor:pointer}
form.add{display:flex;gap:8px}
input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font-size:15px;-webkit-user-select:text;user-select:text}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 6px 20px rgba(255,46,136,.35);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.hot{background:linear-gradient(135deg,#ff7a18,var(--hot))}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff8a00);color:#2a0640}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.sm{width:auto;padding:10px 16px;font-size:15px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;margin:12px 0}
.row>*{flex:1}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{flex:1;margin:0;font-family:Georgia,serif;font-style:italic;font-size:26px;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;line-height:1;cursor:pointer}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:24px;padding:22px 18px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:21px;line-height:1.4;position:relative;overflow:hidden}
.card .tag{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card svg{width:90px;height:90px}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.who{text-align:center;color:var(--muted);margin:2px 0 12px;font-size:15px}
.who b{color:var(--text);font-size:19px}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
.dice{display:flex;justify-content:center;gap:10px;margin:18px 0}
.die{width:31%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:17px;padding:6px;color:#2a0640;background:linear-gradient(145deg,#fff,#ffd6ea);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 8px 20px rgba(255,46,136,.4)}
.die.p{background:linear-gradient(145deg,#ffb3d9,#ff2e88);color:#fff}
.die.g{background:linear-gradient(145deg,#fff1b8,#ffcc4d)}
.die.roll{animation:roll .12s linear infinite}
@keyframes roll{0%{transform:rotate(-8deg) translateY(-4px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-8deg) translateY(-4px)}}
.table{position:relative;width:100%;aspect-ratio:1;max-width:400px;margin:4px auto 10px;border-radius:50%;background:radial-gradient(circle,#3b0d55 0%,#21032f 70%);border:2px solid rgba(255,46,136,.35);box-shadow:0 0 40px rgba(255,46,136,.25) inset}
.table .bottle{position:absolute;left:50%;top:50%;width:26%;height:62%;margin-left:-13%;margin-top:-31%;transition:transform 3.6s cubic-bezier(.12,.75,.15,1)}
.table .bottle svg{width:100%;height:100%}
.seat{position:absolute;left:50%;top:50%;transform-origin:0 0;white-space:nowrap}
.seat span{display:inline-block;transform:translate(-50%,-50%);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;transition:all .3s}
.seat.win span{background:var(--pink);border-color:#fff;transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 20px var(--pink)}
.layers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.layer{padding:6px 11px;border-radius:999px;font-size:13px;background:rgba(155,92,255,.25);border:1px solid rgba(155,92,255,.6);transition:all .5s}
.layer.gone{opacity:.25;text-decoration:line-through;transform:translateY(-6px) rotate(-6deg)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;text-align:left;font-size:16px;cursor:pointer}
.opt.right{background:rgba(46,204,113,.3);border-color:#2ecc71}
.opt.wrong{background:rgba(255,46,99,.3);border-color:var(--hot)}
.q{font-size:19px;line-height:1.4;text-align:center;margin:8px 0 2px}
.meter{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 4px}
.meter div{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));transition:width .5s}
.slots{display:flex;gap:8px;justify-content:center;background:linear-gradient(180deg,#2b0040,#120019);border:3px solid var(--gold);border-radius:22px;padding:14px;box-shadow:0 0 30px rgba(255,204,77,.3)}
.reel{flex:1;aspect-ratio:3/4;background:linear-gradient(180deg,#fff,#ffe3f1 50%,#fff);border-radius:14px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 6px 10px rgba(0,0,0,.25),inset 0 -6px 10px rgba(0,0,0,.25)}
.reel svg{width:76%;height:76%}
.reel.spin svg{animation:blur .1s linear infinite}
@keyframes blur{0%{transform:translateY(-30%);opacity:.6}100%{transform:translateY(30%);opacity:.6}}
.credits{text-align:center;font-size:15px;color:var(--gold);margin:10px 0}
.wyr{display:grid;gap:10px}
.wyr button{border:0;border-radius:20px;padding:22px 16px;font-size:18px;line-height:1.35;min-height:120px;cursor:pointer;position:relative;overflow:hidden;color:#fff}
.wyr .a{background:linear-gradient(135deg,#ff2e88,#c21e6a)}
.wyr .b{background:linear-gradient(135deg,#7b3cff,#4d1cb0)}
.wyr .or{text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:20px;margin:-4px 0}
.wyr .pct{position:absolute;right:12px;bottom:8px;font-size:22px;font-weight:800;opacity:0;transition:opacity .4s}
.wyr.done .pct{opacity:1}
.wyr button.pick{outline:3px solid var(--gold)}
canvas{display:block;width:100%;border-radius:20px;background:linear-gradient(180deg,#2a0640,#14001f);border:1px solid var(--line);touch-action:none}
.hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,0,31,.8);border-radius:20px;text-align:center;padding:20px}
.stage{position:relative}
.overlay svg{width:110px;height:110px}
.date{display:flex;flex-direction:column;align-items:center}
.date svg{width:170px;height:170px}
.bubble{background:#fff;color:#2a0640;border-radius:20px;padding:14px 16px;font-size:18px;line-height:1.35;position:relative;margin:4px 0 6px;text-align:center;font-weight:600}
.bubble:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.pickdate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pickdate button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 4px;cursor:pointer}
.pickdate svg{width:100%;height:auto}
.gate{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.gate svg{width:140px;height:140px}
.gate p{color:var(--muted);line-height:1.5;margin:0 0 6px}
.score{font-size:38px;font-weight:800;color:var(--gold)}
.section{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:24px;margin:26px 0 12px;color:var(--gold)}
.tile.kinky{background:linear-gradient(160deg,rgba(20,0,31,.9),rgba(123,44,191,.35));border-color:rgba(255,204,77,.35)}
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--gold),#ff8a00);color:#2a0640;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:6px}
.banner span{flex:1}
.banner button{border:0;border-radius:12px;background:#2a0640;color:#fff;padding:9px 14px;font-weight:700;cursor:pointer}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chiprow button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);cursor:pointer}
.chiprow button.on{background:var(--gold);color:#2a0640;border-color:var(--gold);font-weight:700}
.ynm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ynm button{border:0;border-radius:16px;padding:16px 4px;font-weight:800;font-size:16px;cursor:pointer}
.ynm .y{background:#2ecc71;color:#0b2a17}.ynm .m{background:var(--gold);color:#2a0640}.ynm .n{background:var(--hot);color:#fff}
.list{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:6px}
.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.timer{font-size:54px;font-weight:900;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;margin:6px 0}
.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--pink);pointer-events:none;animation:flash 1s forwards;z-index:9;white-space:nowrap}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
</style>
</head>

  cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  const tpool = []; TYPES.forEach(t => { for (let i = 0; i < t.w; i++) tpool.push(t); });
  let items, px, score, lives, speed, spawn, raf, last, running = false, pops;
  const reset = () => { items = []; pops = []; px = W / 2; score = 0; lives = 3; speed = 1; spawn = 0; };
  const move = e => { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; px = Math.max(40, Math.min(W - 40, t.clientX - r.left)); };
  cv.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, {passive:false});
  cv.addEventListener('touchstart', move, {passive:true});
  cv.addEventListener('mousemove', move);
  const hud = () => { $('#sc').textContent = 'Score ' + score; $('#lv').innerHTML = '&#10084;'.repeat(Math.max(0, lives)) || '&#128148;'; };
  const loop = t => {
    const dt = Math.min(40, t - (last || t)) / 16.67; last = t;
    speed += .0009 * dt; spawn -= dt;
    if (spawn <= 0) { const ty = pick(tpool); items.push({x: 24 + Math.random() * (W - 48), y: -30, s: 34 + rnd(12), v: (2 + Math.random() * 1.5) * speed, t: ty, r: Math.random() * 6}); spawn = Math.max(14, 42 - speed * 9); }
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (.05 + (i % 3) * .04) + ')'; ctx.fillRect((i * 97) % W, (i * 53 + t * .02 * (1 + i % 3)) % H, 2, 2); }
    const my = H - 50;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.y += it.v * dt; it.r += .05 * dt;
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.r) * .3); ctx.drawImage(img[it.t.k], -it.s / 2, -it.s / 2, it.s, it.s); ctx.restore();
      if (it.y > my - 20 && it.y < my + 20 && Math.abs(it.x - px) < 48) {
        items.splice(i, 1);
        if (it.t.bad) { lives--; buzz(200); beep(140, .4, 'sawtooth'); pops.push({x: it.x, y: my - 30, txt: 'Brrr!', a: 1, c: '#9fc6e8'}); }

        hud();
      } else if (it.y > H + 30) { items.splice(i, 1); }
    }
    pops.forEach(p => { p.y -= 1.2 * dt; p.a -= .025 * dt; ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = p.c; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.txt, p.x, p.y); });
    ctx.globalAlpha = 1; pops = pops.filter(p => p.a > 0);
    ctx.save(); ctx.shadowColor = '#ff2e88'; ctx.shadowBlur = 20; ctx.drawImage(mouth, px - 48, my - 32, 96, 66); ctx.restore();
    if (lives <= 0) return over();
    raf = requestAnimationFrame(loop);
  };
  const over = () => {
    running = false;
    const b = Math.max(best, score, store.get('kissBest', 0)); store.set('kissBest', b);
    const ov = $('#ov'); ov.style.display = 'flex';

    $('#go').onclick = start;
  };
  const start = () => { $('#ov').style.display = 'none'; reset(); hud(); last = 0; running = true; raf = requestAnimationFrame(loop); };
  $('#go').onclick = start;
  cleanup = () => cancelAnimationFrame(raf);
}

      if (upd.auto && upd.mode === 'auto') updInstall();
      break;
    case 'current': upd.info = null; upd.msg = upd.auto ? '' : `You're on the latest version (${o.current}).`; break;
    case 'downloading': upd.busy = true; upd.msg = `Downloading update... ${o.progress}%`; break;
    case 'installing': upd.msg = 'Installing...'; break;
    case 'confirm': upd.msg = 'Tap Update on the Android prompt to finish.'; break;
    case 'permission': upd.msg = 'Allow Naughty Night to install apps, then come back. The update carries on by itself.'; break;
    case 'installed': upd.busy = false; upd.info = null; upd.msg = 'Updated. Reopen the app.'; break;
    case 'error': upd.busy = false; upd.msg = (upd.auto && !upd.info) ? '' : o.message; break;
  }
  if (o.state === 'available' || o.state === 'current') upd.auto = false;
  drawUpd();
};
function drawUpd() {
  const ban = $('#updBanner');
  if (ban) {
    if (upd.busy) ban.innerHTML = `<div class="banner"><span>${esc(upd.msg)}</span></div>`;
    else if (upd.info) ban.innerHTML = `<div class="banner"><span>Update ${esc(upd.info.version)} is ready</span><button id="banGo">Install</button></div>`;
    else ban.innerHTML = '';
    const b = $('#banGo'); if (b) b.onclick = updInstall;
  }
  if (!$('#updPanel')) return;
  $('#updMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === upd.mode));
  $('#updCh').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === upd.channel));
  $('#updHelp').textContent = {
    auto: 'Checks each time the app opens, downloads new versions by itself and asks you to confirm the install.',
    notify: 'Checks each time the app opens and shows a banner. You choose when to install.',
    manual: 'Never checks by itself. Use the button below.'
  }[upd.mode] + (upd.channel === 'beta' ? ' Beta gets pre-release builds first.' : '');
  $('#updMsg').textContent = upd.msg;
  $('#updNow').textContent = upd.info && !upd.busy ? `Install version ${upd.info.version}` : 'Check for updates now';
  $('#updNow').onclick = upd.info && !upd.busy ? updInstall : () => updCheck(false);
  $('#updNow').disabled = upd.busy;
}

route();
if (hasNN() && upd.mode !== 'manual') setTimeout(() => updCheck(true), 1200);
</script>
</body>
</html>
