<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Naughty Night</title>
<style>
:root{--bg:#14001f;--pink:#ff2e88;--hot:#ff5f6d;--purple:#9b5cff;--gold:#ffcc4d;--text:#fff1f8;--muted:#c9a8d6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#4a0d6e 0%,#14001f 65%) fixed}
#app{max-width:560px;margin:0 auto;padding:16px 16px 80px}
button{font:inherit;color:inherit}
.logo{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:46px;text-align:center;margin:14px 0 0;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:4px 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:linear-gradient(160deg,rgba(255,46,136,.20),rgba(155,92,255,.12));border:1px solid var(--line);border-radius:20px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.95)}
.grid .tile:last-child:nth-child(odd){grid-column:span 2}
.tile svg{width:66px;height:66px;filter:drop-shadow(0 4px 12px rgba(255,46,136,.5))}
.tile b{display:block;font-size:16px;margin-top:6px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 16px}
.ptitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:rgba(255,46,136,.22);border:1px solid rgba(255,46,136,.5);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.3);display:inline-grid;place-items:center;cursor:pointer}
form.add{display:flex;gap:8px}
input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font-size:15px;-webkit-user-select:text;user-select:text}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 6px 20px rgba(255,46,136,.35);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.hot{background:linear-gradient(135deg,#ff7a18,var(--hot))}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ff8a00);color:#2a0640}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.sm{width:auto;padding:10px 16px;font-size:15px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;margin:12px 0}
.row>*{flex:1}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{flex:1;margin:0;font-family:Georgia,serif;font-style:italic;font-size:26px;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;line-height:1;cursor:pointer}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:24px;padding:22px 18px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:21px;line-height:1.4;position:relative;overflow:hidden}
.card .tag{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card svg{width:90px;height:90px}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.who{text-align:center;color:var(--muted);margin:2px 0 12px;font-size:15px}
.who b{color:var(--text);font-size:19px}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
.dice{display:flex;justify-content:center;gap:10px;margin:18px 0}
.die{width:31%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:17px;padding:6px;color:#2a0640;background:linear-gradient(145deg,#fff,#ffd6ea);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 8px 20px rgba(255,46,136,.4)}
.die.p{background:linear-gradient(145deg,#ffb3d9,#ff2e88);color:#fff}
.die.g{background:linear-gradient(145deg,#fff1b8,#ffcc4d)}
.die.roll{animation:roll .12s linear infinite}
@keyframes roll{0%{transform:rotate(-8deg) translateY(-4px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-8deg) translateY(-4px)}}
.table{position:relative;width:100%;aspect-ratio:1;max-width:400px;margin:4px auto 10px;border-radius:50%;background:radial-gradient(circle,#3b0d55 0%,#21032f 70%);border:2px solid rgba(255,46,136,.35);box-shadow:0 0 40px rgba(255,46,136,.25) inset}
.table .bottle{position:absolute;left:50%;top:50%;width:26%;height:62%;margin-left:-13%;margin-top:-31%;transition:transform 3.6s cubic-bezier(.12,.75,.15,1)}
.table .bottle svg{width:100%;height:100%}
.seat{position:absolute;left:50%;top:50%;transform-origin:0 0;white-space:nowrap}
.seat span{display:inline-block;transform:translate(-50%,-50%);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;transition:all .3s}
.seat.win span{background:var(--pink);border-color:#fff;transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 20px var(--pink)}
.layers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.layer{padding:6px 11px;border-radius:999px;font-size:13px;background:rgba(155,92,255,.25);border:1px solid rgba(155,92,255,.6);transition:all .5s}
.layer.gone{opacity:.25;text-decoration:line-through;transform:translateY(-6px) rotate(-6deg)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;text-align:left;font-size:16px;cursor:pointer}
.opt.right{background:rgba(46,204,113,.3);border-color:#2ecc71}
.opt.wrong{background:rgba(255,46,99,.3);border-color:var(--hot)}
.q{font-size:19px;line-height:1.4;text-align:center;margin:8px 0 2px}
.meter{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 4px}
.meter div{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));transition:width .5s}
.wyr{display:grid;gap:10px}
.wyr button{border:0;border-radius:20px;padding:22px 16px;font-size:18px;line-height:1.35;min-height:120px;cursor:pointer;position:relative;overflow:hidden;color:#fff}
.wyr .a{background:linear-gradient(135deg,#ff2e88,#c21e6a)}
.wyr .b{background:linear-gradient(135deg,#7b3cff,#4d1cb0)}
.wyr .or{text-align:center;font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:20px;margin:-4px 0}
.wyr .pct{position:absolute;right:12px;bottom:8px;font-size:22px;font-weight:800;opacity:0;transition:opacity .4s}
.wyr.done .pct{opacity:1}
.wyr button.pick{outline:3px solid var(--gold)}
.gate{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.gate svg{width:140px;height:140px}
.gate p{color:var(--muted);line-height:1.5;margin:0 0 6px}
.section{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:24px;margin:26px 0 12px;color:var(--gold)}
.tile.kinky{background:linear-gradient(160deg,rgba(20,0,31,.9),rgba(123,44,191,.35));border-color:rgba(255,204,77,.35)}
.banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--gold),#ff8a00);color:#2a0640;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:6px}
.banner span{flex:1}
.banner button{border:0;border-radius:12px;background:#2a0640;color:#fff;padding:9px 14px;font-weight:700;cursor:pointer}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chiprow button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);cursor:pointer}
.chiprow button.on{background:var(--gold);color:#2a0640;border-color:var(--gold);font-weight:700}
.ynm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ynm button{border:0;border-radius:16px;padding:16px 4px;font-weight:800;font-size:16px;cursor:pointer}
.ynm .y{background:#2ecc71;color:#0b2a17}.ynm .m{background:var(--gold);color:#2a0640}.ynm .n{background:var(--hot);color:#fff}
.list{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:6px}
.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.dice4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.d10{aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#fff1b8,#ffcc4d);color:#2a0640;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 6px 16px rgba(255,204,77,.3)}
.d10 small{font-weight:800;font-size:12px;opacity:.7}
.d10 b{font-size:34px;font-weight:900;line-height:1}
.timer{font-size:54px;font-weight:900;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;margin:6px 0}
.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 20px var(--pink);pointer-events:none;animation:flash 1s forwards;z-index:9;white-space:nowrap}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.card .ph{display:block;width:calc(100% + 36px);height:150px;object-fit:cover;margin:-22px -18px 16px;opacity:.85}
.card svg.posart{width:100%;height:170px;margin-bottom:8px}
.seg button:disabled{opacity:.3}
.sos{position:fixed;right:12px;bottom:12px;display:flex;gap:6px;z-index:8}
.sos button{border:1px solid var(--line);background:rgba(20,0,31,.92);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
.sos #sosStop{border-color:rgba(255,95,109,.7);color:#ffb3bb}
.ov{position:fixed;inset:0;background:rgba(10,0,16,.94);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.ico{display:inline-block;vertical-align:-4px}
.ico svg{width:20px;height:20px}
.small{font-size:15px;color:var(--muted);line-height:1.5}
.line{font-family:Georgia,serif;font-style:italic;color:var(--gold)}
.day{display:flex;align-items:center;gap:10px}
.day .txt{flex:1}
.day.locked{opacity:.5}
textarea{width:100%;min-height:70px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 12px;font:inherit;font-size:15px;-webkit-user-select:text;user-select:text;resize:vertical}
</style>
</head>

<script>
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app');
const store = {
  get(k, d) { try { const v = localStorage.getItem('nn_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nn_' + k, JSON.stringify(v)); } catch (e) {} }
};
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const deck = arr => { let d = []; return () => { if (!arr.length) return undefined; if (!d.length) d = shuffle(arr); return d.pop(); }; };
const pop = el => { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };

// ---------- sound ----------
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();

    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, actx.currentTime);

  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function flash(txt) { const d = document.createElement('div'); d.className = 'flash'; d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
// Counts down in el, then calls done. Stops by itself if el leaves the page.
function countdown(secs, el, done) {
  const end = Date.now() + secs * 1000; el.textContent = mmss(secs);
  const id = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(id);
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    el.textContent = mmss(left);
    if (left <= 0) { clearInterval(id); beep(880, .5, 'triangle'); buzz([100, 80, 100]); if (done) done(); }
  }, 250);
  return id;
}

function gPower() { kinkGate('Power Play', () => {
  const p = plist().length >= 2 ? plist() : ['Dom', 'sub'];

  cleanup = () => clearInterval(iv);
  const setup = () => {

      $('#len').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === len));
      $('#start').disabled = dom === sub;
    };
    marks();
    $('#dom').onclick = e => { if (e.target.dataset.i) { dom = +e.target.dataset.i; marks(); } };
    $('#sub').onclick = e => { if (e.target.dataset.i) { sub = +e.target.dataset.i; marks(); } };
    $('#len').onclick = e => { if (e.target.dataset.n) { len = +e.target.dataset.n; marks(); } };
    $('#rand').onclick = () => { dom = rnd(p.length); do { sub = rnd(p.length); } while (sub === dom); marks(); };
    $('#start').onclick = () => scene(shuffle(POWER.concat(custom('power').map(t => [t, 0])).filter(c => allowed(c[0], 'Power'))).slice(0, len));
  };
  const D = () => esc(p[dom]), Sb = () => esc(p[sub]);

    let k = 0;

    setSkip(() => { k++; card(); });
    const card = () => {
      clearInterval(iv);
      if (k >= cards.length) return aftercare('Scene complete.');
      if (k > 0 && k % 4 === 0 && !card.checked) { card.checked = true; return checkin(); }
      card.checked = false;
      const [txt, secs] = cards[k];
      shell('Power Play', `<div class="meter"><div style="width:${k / cards.length * 100}%"></div></div><div class="who"><b>${D()}</b> commands <b>${Sb()}</b> &middot; order ${k + 1} of ${cards.length}</div>

      <div class="row">${secs ? '<button class="btn ghost" id="go">Start timer</button>' : ''}<button class="btn" id="done">Done, next order</button></div>
      <div class="row"><button class="btn hot" id="safe">${Sb()} says the safe word</button></div>`);
      beep(220, .3, 'sawtooth', .05);
      if (secs) $('#go').onclick = () => {
        let left = secs; $('#go').disabled = true; clearInterval(iv);
        iv = setInterval(() => { left--; const t = $('#tm'); if (t) t.textContent = left + 's'; if (left <= 0) { clearInterval(iv); beep(880, .5, 'triangle'); buzz([100, 80, 100]); if (t) t.textContent = 'Time'; } }, 1000);
      };
      $('#done').onclick = () => { k++; card(); };
      $('#safe').onclick = () => aftercare('Safe word called. Scene over, no questions asked.');
    };
    const checkin = () => {
      shell('Power Play', `<div class="card pop"><span class="tag">Check-in</span><p style="margin:0">${Sb()}, what colour are you?</p></div>
      <div class="ynm"><button class="y" id="g">Green</button><button class="m" id="yl">Yellow</button><button class="n" id="r">Red</button></div>`);
      $('#g').onclick = card;
      $('#yl').onclick = () => { flash('Slowing down'); card(); };
      $('#r').onclick = () => aftercare('Red called. Scene over, no questions asked.');
    };
    card();
  };
  const aftercare = why => {
    clearInterval(iv); setSkip(null);
    shell('Power Play', `<div class="card pop">${ART.heart}<p style="margin:12px 0 6px;font-weight:700">${why}</p><p style="margin:0;font-size:16px;color:var(--muted);line-height:1.5">Aftercare time. Water, a blanket, a cuddle. ${D()}, check in with ${Sb()}. Then tell each other the best bit.</p></div>
    <div class="row"><button class="btn" id="again">New scene</button></div>`);
    $('#again').onclick = setup;
  };
  setup();
}); }

function gTease() { kinkGate('Tease Timer', () => {
  const p = plist().length >= 2 ? plist() : ['You', 'Them'];
  let teaser = 0, teased = 1, heat = capHeat(store.get('ttHeat', 0)), mins = 10, iv = null;
  cleanup = () => clearInterval(iv);
  const setup = () => {
    clearInterval(iv); setSkip(null); pauseHook = null;
    const opts = id => `<div class="chiprow" id="${id}">${p.map((n, i) => `<button data-i="${i}">${esc(n)}</button>`).join('')}</div>`;
    shell('Tease Timer', `<div class="card pop" style="min-height:0">${ART.stopwatch}<p style="margin:10px 0 0;font-size:16px;color:var(--muted);line-height:1.5">The phone calls every move. When the alarm goes, you switch, straight away. Lay it face up where you can both see it.</p></div>
    <div class="ptitle" style="margin-top:16px">Teaser</div>${opts('ter')}<div class="ptitle">Being teased</div>${opts('ted')}
    <div class="ptitle">Intensity</div>${heatSeg('heat', ['Slow burn', 'Heated', 'Merciless'])}
    <div class="ptitle">Length</div><div class="seg" id="len">${[5, 10, 15].map(n => `<button data-n="${n}">${n} min</button>`).join('')}</div>
    <div class="row"><button class="btn hot" id="start">Start the clock</button></div>`);
    const marks = () => {
      $('#ter').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === teaser));
      $('#ted').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === teased));
      $('#heat').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.h === heat));
      $('#len').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === mins));
      $('#start').disabled = teaser === teased;
    };
    marks();
    $('#ter').onclick = e => { if (e.target.dataset.i) { teaser = +e.target.dataset.i; marks(); } };
    $('#ted').onclick = e => { if (e.target.dataset.i) { teased = +e.target.dataset.i; marks(); } };
    $('#heat').onclick = e => { if (e.target.dataset.h) { heat = +e.target.dataset.h; store.set('ttHeat', heat); marks(); } };
    $('#len').onclick = e => { if (e.target.dataset.n) { mins = +e.target.dataset.n; marks(); } };
    $('#start').onclick = run;
  };
  const run = () => {
    const steps = []; let total = 0, pool = [];
    const base = TEASE[heat].concat(custom('tease', heat).map(t => [t, 60])).filter(s => allowed(s[0]));
    if (!base.length) return finish('Nothing left at this intensity after your limits.');
    while (total < mins * 60) { if (!pool.length) pool = shuffle(base); const s = pool.pop(); steps.push(s); total += s[1]; }
    let k = -1, end = 0, left = 0, paused = false;
    const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    shell('Tease Timer', `<div class="who"><b>${esc(p[teaser])}</b> teases <b>${esc(p[teased])}</b> &middot; <span id="stepNo"></span></div>
    <div class="meter"><div id="prog" style="width:0"></div></div>
    <div class="card"><span class="tag" id="tag"></span><p id="txt" style="margin:0;font-size:24px;font-weight:700"></p><div class="timer" id="tm"></div></div>
    <div class="who" id="nextUp" style="margin-top:10px"></div>
    <div class="row"><button class="btn ghost" id="pause">Pause</button><button class="btn ghost" id="skip">Skip</button></div>
    <div class="row"><button class="btn hot" id="stop">Safe word: stop</button></div>`);
    const step = () => {
      k++;
      if (k >= steps.length) return finish('Time. Scene over.');
      left = steps[k][1]; end = Date.now() + left * 1000;
      $('#txt').textContent = steps[k][0];
      $('#tag').textContent = /^Freeze/.test(steps[k][0]) ? 'Freeze' : /^Switch/.test(steps[k][0]) ? 'Switch' : ['Slow burn', 'Heated', 'Merciless'][heat];
      $('#stepNo').textContent = `move ${k + 1} of ${steps.length}`;
      $('#prog').style.width = (k / steps.length * 100) + '%';
      $('#nextUp').textContent = k + 1 < steps.length ? 'Next: ' + steps[k + 1][0] : 'Last move';
      const c = $('#txt').parentNode; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
      beep(880, .35, 'triangle'); buzz([120, 60, 120]);
    };
    const tick = () => {
      if (paused) return;
      left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      const t = $('#tm'); if (t) t.textContent = fmt(left);
      if (left <= 3 && left > 0) beep(440, .05, 'sine', .04);
      if (left <= 0) step();
    };
    $('#pause').onclick = () => {
      paused = !paused;
      if (!paused) end = Date.now() + left * 1000;
      $('#pause').textContent = paused ? 'Resume' : 'Pause';
    };
    $('#skip').onclick = () => { paused = false; $('#pause').textContent = 'Pause'; step(); };
    $('#stop').onclick = () => finish('Safe word called. Everything stops, no questions asked.');
    setSkip(() => $('#skip').click());
    pauseHook = () => { if (!paused) $('#pause').click(); };
    step(); tick();
    iv = setInterval(tick, 250);
  };
  const finish = why => {
    clearInterval(iv); setSkip(null); pauseHook = null;
    shell('Tease Timer', `<div class="card pop">${ART.heart}<p style="margin:12px 0 6px;font-weight:700">${why}</p><p style="margin:0;font-size:16px;color:var(--muted);line-height:1.5">What happens next is up to you two. Water, a cuddle, and tell each other the best bit.</p></div>
    <div class="row"><button class="btn" id="again">Go again</button></div>`);
    $('#again').onclick = setup;
  };
  setup();
}); }

const two = (a, b) => plist().length >= 2 ? plist() : [a, b];
const photo = name => `<img class="ph" src="img/${name}.jpg" alt="">`;

function gLoveMap() {
  const names = two('Partner A', 'Partner B'), rounds = 10;
  const next = deck(LOVEMAP), fq = deck(LM_FORFEIT);
  let turn = 0, score = [0, 0];
  shell('Love Map', `<div class="who" id="sc"></div><div class="card" id="card"></div><div id="ctl"></div>
  <div class="note">The person being asked about is the judge. Be honest, and be kind.</div>`);
  const me = () => turn % 2, them = () => 1 - turn % 2, nm = s => s.replace(/\{n\}/g, names[them()]);
  const drawSc = () => $('#sc').innerHTML = `${esc(names[0])} <b>${score[0]}</b> &nbsp;&middot;&nbsp; ${esc(names[1])} <b>${score[1]}</b> &nbsp;&middot;&nbsp; round ${Math.floor(turn / 2) + 1} of ${rounds}`;
  const ask = () => {
    if (turn >= rounds * 2) return end();
    drawSc();
    const c = $('#card'); pop(c);
    c.innerHTML = `<span class="tag">${esc(names[me()])} answers</span><p style="margin:0">${esc(nm(next()))}</p>`;
    $('#ctl').innerHTML = `<div class="who" style="margin-top:12px">${esc(names[them()])}, did they get it right?</div><div class="row"><button class="btn" id="y">Spot on</button><button class="btn hot" id="n">Not even close</button></div>`;
    $('#y').onclick = () => { score[me()]++; flash('Point'); beep(880, .2, 'triangle'); turn++; ask(); };
    $('#n').onclick = () => { buzz(80); beep(200, .3, 'sawtooth'); forfeit(); };
    setSkip(ask);
  };
  const forfeit = () => {
    const c = $('#card'); pop(c);
    c.innerHTML = `<span class="tag">Forfeit &middot; ${esc(names[me()])}</span><p style="margin:0">${esc(nm(fq()))}</p>`;
    $('#ctl').innerHTML = `<div class="row"><button class="btn" id="ok">Done</button></div>`;
    $('#ok').onclick = () => { turn++; ask(); };
    setSkip(forfeit);
  };
  const end = () => {
    setSkip(null);
    const w = score[0] === score[1] ? -1 : score[0] > score[1] ? 0 : 1;
    shell('Love Map', `<div class="card pop">${ART.lovemap}<p style="margin:12px 0 6px;font-weight:700">${w < 0 ? `A draw at ${score[0]} each.` : `${esc(names[w])} wins, ${score[w]} to ${score[1 - w]}.`}</p><p class="small" style="margin:0">${w < 0 ? 'You know each other equally well. Kiss and call it even.' : `${esc(names[w])} picks one thing ${esc(names[1 - w])} has to do for them tonight.`}</p></div>
    <div class="row"><button class="btn" id="again">Play again</button></div>`);

  ask();
}

function gSensation() {
  const p = two('You', 'Them');
  let turn = 0, blind = store.get('sensBlind', false), score = [0, 0], iv = null, busy = false;
  cleanup = () => clearInterval(iv);

  <div class="who" id="who"></div>
  <div class="dice" style="margin:8px 0 14px"><div class="die" id="dz" style="width:48%;font-size:15px">Where?</div><div class="die p" id="ds" style="width:48%;font-size:15px">What?</div></div>

function gSlowBurn() { kinkGate('Slow Burn', () => {
  const p = two('You', 'Them');
  let heat = capHeat(store.get('sbHeat', 0)), mins = 20, iv = null;
  cleanup = () => clearInterval(iv);
  const setup = () => {
    clearInterval(iv); setSkip(null); pauseHook = null;
    shell('Slow Burn', `<div class="card pop" style="min-height:0">${photo('slowburn')}<p class="small" style="margin:0">Five stages, each with its own rules. The next one stays locked until the timer runs out, so there's no skipping ahead. Pause or call the safe word whenever you need to.</p></div>
    <div class="ptitle" style="margin-top:16px">Heat</div>${heatSeg('heat', ['Gentle', 'Heated', 'Wild'])}
    <div class="ptitle">Length</div><div class="seg" id="len">${[20, 30, 40].map(n => `<button data-n="${n}">${n} min</button>`).join('')}</div>
    <div class="row"><button class="btn hot" id="start">Light the candle</button></div>`);
    const marks = () => {
      $('#heat').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.h === heat));
      $('#len').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === mins));
    };
    marks();
    $('#heat').onclick = e => { if (e.target.dataset.h) { heat = +e.target.dataset.h; store.set('sbHeat', heat); marks(); } };
    $('#len').onclick = e => { if (e.target.dataset.n) { mins = +e.target.dataset.n; marks(); } };
    $('#start').onclick = run;
  };
  const run = () => {
    const stages = SLOWBURN[heat], per = mins * 12; // seconds per stage: mins * 60 / 5
    let k = 0, end = 0, left = 0, paused = false, prompts = null;
    shell('Slow Burn', `<div class="meter"><div id="prog" style="width:0"></div></div><div class="who" id="st"></div>
    <div class="card"><span class="tag" id="tag"></span><p id="rule" style="margin:0 0 12px;font-weight:700"></p><p id="pr" class="small" style="margin:0;font-size:17px"></p><div class="timer" id="tm"></div></div>
    <div class="row"><button class="btn" id="next" disabled></button></div>
    <div class="row"><button class="btn ghost" id="pause">Pause</button><button class="btn hot" id="stop">Safe word: stop</button></div>`);
    const prompt = () => { $('#pr').textContent = prompts() || ''; };
    const stage = () => {
      const [name, rule, ps, alt] = stages[k];
      prompts = deck(ps.filter(x => allowed(x)));
      $('#tag').textContent = 'Stage ' + (k + 1) + ' · ' + name;
      $('#rule').textContent = allowed(rule) ? rule : (alt || 'Take this stage at your own pace, within your limits.');
      $('#st').innerHTML = `<b>${esc(p[0])}</b> and <b>${esc(p[1])}</b> &middot; stage ${k + 1} of 5`;
      $('#prog').style.width = (k / 5 * 100) + '%';
      left = per; end = Date.now() + per * 1000; paused = false; $('#pause').textContent = 'Pause';
      prompt(); lockNext();
      pop($('#rule').parentNode); beep(660, .3, 'triangle'); buzz([80, 60, 80]);
    };
    const lockNext = () => {
      const b = $('#next'), last = k === 4;
      if (left > 0 && !last) { b.disabled = true; b.innerHTML = `<span class="ico">${ART.lock}</span> Stage ${k + 2} unlocks in ${mmss(left)}`; }
      else { b.disabled = false; b.textContent = last ? 'Finish' : `Unlock stage ${k + 2}`; }
    };
    const tick = () => {
      if (paused) return;
      const was = left;
      left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      $('#tm').textContent = mmss(left);
      if (was > 0 && left === 0) { beep(880, .5, 'triangle'); buzz([120, 60, 120]); flash(k < 4 ? 'Unlocked' : 'Time'); }
      lockNext();
    };
    $('#next').onclick = () => { if (k >= 4) return finish('Time. All five stages done.'); k++; stage(); };
    $('#pause').onclick = () => { paused = !paused; if (!paused) end = Date.now() + left * 1000; $('#pause').textContent = paused ? 'Resume' : 'Pause'; };
    $('#stop').onclick = () => finish('Safe word called. Everything stops, no questions asked.');
    setSkip(prompt);
    pauseHook = () => { if (!paused) $('#pause').click(); };
    stage(); tick();
    iv = setInterval(tick, 250);
  };
  const finish = why => {
    clearInterval(iv); setSkip(null); pauseHook = null;
    shell('Slow Burn', `<div class="card pop">${ART.heart}<p style="margin:12px 0 6px;font-weight:700">${why}</p><p class="small" style="margin:0">Water, a blanket, a cuddle. Tell each other which stage was the hardest to wait through.</p></div>
    <div class="row"><button class="btn" id="again">Go again</button></div>`);
    $('#again').onclick = setup;
  };
  setup();
}); }

function gDateNight() {
  const dn = store.get('dn', null);
  const name = id => GAMES.find(g => g.id === id).name;
  if (dn && dn.i >= dn.plan.length) {
    store.set('dn', null);
    shell('Date Night', `<div class="card pop">${photo('datenight')}<p style="margin:0 0 6px;font-weight:700">That's the night.</p><p class="small" style="margin:0">Phones down. Tell each other the best moment of the evening.</p></div>
    <div class="row"><button class="btn" id="home">Back home</button></div>`);
    $('#home').onclick = () => { location.hash = ''; };
    return;
  }
  if (dn) {
    shell('Date Night', `<div class="card pop" style="min-height:0">${photo('datenight')}<p style="margin:0;font-weight:700">Tonight's plan</p></div>
    <ul class="list">${dn.plan.map((id, i) => `<li${i === dn.i ? ' style="border-color:var(--gold)"' : ''}>${i < dn.i ? `<span class="ico">${ART.tick}</span> ` : ''}<b>${esc(dn.names[i])}</b> &middot; ${esc(name(id))}</li>`).join('')}</ul>
    <div class="row"><button class="btn ghost" id="new">Plan a new night</button><button class="btn" id="go">Resume stage ${dn.i + 1}</button></div>`);
    $('#go').onclick = () => { location.hash = dn.plan[dn.i]; };
    $('#new').onclick = () => { store.set('dn', null); gDateNight(); };
    return;
  }
  let len = store.get('dnLen', 4), plan = [];
  const stages = () => (len === 4 ? DN_STAGES : [DN_STAGES[0], DN_STAGES[2], DN_STAGES[3]]).map(([n, opts]) => {
    // On Mild the after-dark stage sticks to the gentler games.
    if (n === 'After dark' && maxHeat() === 0) opts = ['positions', 'slowburn'];
    return [n, opts];
  });
  const build = () => { const used = []; plan = stages().map(([n, opts]) => { const free = opts.filter(o => !used.includes(o)); const g = pick(free.length ? free : opts); used.push(g); return g; }); };
  const draw = () => {
    const st = stages();
    shell('Date Night', `<div class="card pop" style="min-height:0">${photo('datenight')}<p class="small" style="margin:0">The app runs your whole evening, warming up from flirty to after dark. A bar at the top of each game moves you to the next stage when you're ready.</p></div>
    <div class="ptitle" style="margin-top:16px">How long</div><div class="seg" id="len"><button data-n="3">About 45 min</button><button data-n="4">About 75 min</button></div>
    <ul class="list">${plan.map((id, i) => `<li style="display:flex;align-items:center;gap:8px"><span style="flex:1"><b>${esc(st[i][0])}</b> &middot; ${esc(name(id))}</span><button class="btn sm ghost" data-c="${i}" style="padding:6px 12px;font-size:13px">Change</button></li>`).join('')}</ul>
    <div class="row"><button class="btn ghost" id="shuf">Shuffle</button><button class="btn hot" id="start">Start the night</button></div>`);
    $('#len').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === len));
    $('#len').onclick = e => { if (e.target.dataset.n) { len = +e.target.dataset.n; store.set('dnLen', len); build(); draw(); } };
    app.querySelector('.list').onclick = e => {
      const i = e.target.dataset.c; if (i == null) return;
      const opts = st[i][1]; plan[i] = opts[(opts.indexOf(plan[i]) + 1) % opts.length]; draw();
    };
    $('#shuf').onclick = () => { build(); draw(); };
    $('#start').onclick = () => { store.set('dn', {plan, names: st.map(s => s[0]), i: 0}); location.hash = plan[0]; };
  };
  build(); draw();
}

function gStreak() {
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  // Midday on day n, so a daylight-saving change can't push it into the wrong date.
  const dateOf = (st, n) => new Date(st.start + (n - 1) * 864e5 + 432e5);
  const wd = d => d.toLocaleDateString('en-AU', {weekday: 'long'});
  let resetArm = false;
  const draw = () => {
    const st = store.get('streak', null);
    if (!st) {
      shell('Challenge Streaks', `<div class="card pop" style="min-height:0">${ART.calendar}<p class="small" style="margin:10px 0 0">One small dare a day for a week, building up to a planned night on day 7. A new dare unlocks each morning.</p></div>
      ${STREAKS.map((s, i) => `<div class="panel" style="margin-top:12px"><div class="ptitle">${esc(s.n)}</div><p class="small" style="margin:0 0 10px">Day 1: ${esc(s.days[0])}</p><button class="btn${i ? ' hot' : ''}" data-t="${i}"${s.heat > maxHeat() ? ' disabled' : ''}>${s.heat > maxHeat() ? 'Turn up the heat dial to unlock' : 'Start today'}</button></div>`).join('')}`);
      app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { store.set('streak', {t: +b.dataset.t, start: today(), done: []}); draw(); });
      return;
    }
    const s = STREAKS[st.t], now = Math.round((today() - st.start) / 864e5) + 1;
    const all = st.done.length >= 7;
    shell('Challenge Streaks', `<div class="who"><b>${esc(s.n)}</b> &middot; ${st.done.length} of 7 done</div><div class="meter"><div style="width:${st.done.length / 7 * 100}%"></div></div>
    ${s.days.map((txt, i) => {
      const n = i + 1, done = st.done.includes(n), open = n <= now;
      return `<div class="panel day${open ? '' : ' locked'}"><span class="ico">${done ? ART.tick : open ? ART.heart : ART.lock}</span><div class="txt"><div class="ptitle" style="margin:0 0 4px">Day ${n} &middot; ${wd(dateOf(st, n))}</div>${open ? `<div style="font-size:15px">${esc(txt)}</div>` : `<div class="small" style="font-size:14px">Unlocks ${wd(dateOf(st, n))}</div>`}</div>${open && !done ? `<button class="btn sm" data-d="${n}">Done</button>` : ''}</div>`;
    }).join('')}
    ${all ? `<div class="card pop" style="min-height:0">${ART.fire}<p style="margin:10px 0 0;font-weight:700">Streak complete. Seven for seven.</p></div>` : ''}
    <div class="row"><button class="btn ghost" id="reset">${resetArm ? 'Tap again to start over' : all ? 'Start another week' : 'Start over'}</button></div>`);
    app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { st.done.push(+b.dataset.d); store.set('streak', st); flash('Done'); beep(880, .2, 'triangle'); draw(); });
    $('#reset').onclick = () => { if (resetArm || all) { store.set('streak', null); resetArm = false; } else resetArm = true; draw(); };
  };
  draw();
}

function gMine() {
  const DECKS = [['truth', 'Truth', ['Flirty','Spicy','Filthy']], ['dare', 'Dare', ['Flirty','Spicy','Filthy']], ['kink', 'Kink challenge', ['Tease','Bold','Wild']], ['power', 'Power order', null], ['tease', 'Tease move', ['Slow burn','Heated','Merciless']]];
  let d = 'dare', h = 0;
  const draw = () => {
    const D = DECKS.find(x => x[0] === d), all = store.get('custom', []);
    const mine = all.map((c, i) => [c, i]).filter(([c]) => c.d === d);
    shell('My Cards', `<div class="chiprow" id="decks">${DECKS.map(x => `<button data-d="${x[0]}"${x[0] === d ? ' class="on"' : ''}>${x[1]}</button>`).join('')}</div>
    ${D[2] ? `<div class="seg" id="lvl">${D[2].map((l, i) => `<button data-h="${i}"${i === h ? ' class="on"' : ''}>${l}</button>`).join('')}</div>` : ''}
    <form id="addc"><textarea id="txt" maxlength="200" placeholder="Write your ${D[1].toLowerCase()}..."></textarea><div class="row"><button class="btn">Add to the deck</button></div></form>
    <h3 class="section" style="font-size:20px">Your ${D[1].toLowerCase()} cards</h3>
    <ul class="list" id="list">${mine.length ? mine.map(([c, i]) => `<li style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(c.t)}${D[2] ? ` <span class="small" style="font-size:12px">&middot; ${D[2][c.h]}</span>` : ''}</span><button class="btn sm ghost" data-x="${i}" style="padding:6px 12px;font-size:13px">Remove</button></li>`).join('') : '<li class="small">None yet.</li>'}</ul>
    <div class="note">Saved on this phone only. Your cards get shuffled into the matching deck, and your limits still apply to them.</div>`);
    $('#decks').onclick = e => { if (e.target.dataset.d) { d = e.target.dataset.d; draw(); } };
    if (D[2]) $('#lvl').onclick = e => { if (e.target.dataset.h) { h = +e.target.dataset.h; draw(); } };
    $('#addc').onsubmit = e => {
      e.preventDefault(); const t = $('#txt').value.trim(); if (!t) return;
      all.push({d, h: D[2] ? h : 0, t}); store.set('custom', all); flash('Added'); draw();
    };
    $('#list').onclick = e => { const i = e.target.dataset.x; if (i != null) { all.splice(+i, 1); store.set('custom', all); draw(); } };
  };
  draw();
}

// ---------- updates ----------
const hasNN = () => typeof window.NN !== 'undefined';
const upd = {mode: store.get('updMode', 'auto'), channel: store.get('updChannel', 'stable'), info: null, msg: '', auto: false, busy: false};
function updCheck(auto) {
  if (!hasNN() || upd.busy) return;
  upd.auto = auto; if (!auto) upd.msg = 'Checking for updates...';
  drawUpd(); NN.check(upd.channel);
}
function updInstall() { if (upd.info && hasNN()) { upd.busy = true; upd.msg = 'Starting download...'; drawUpd(); NN.install(upd.info.url); } }
window.nnUpdate = o => {
  switch (o.state) {
    case 'available':
      upd.info = o; upd.msg = `Version ${o.version}${o.prerelease ? ' (beta)' : ''} is available.`;
      if (upd.auto && upd.mode === 'auto') updInstall();
      break;
    case 'current': upd.info = null; upd.msg = upd.auto ? '' : `You're on the latest version (${o.current}).`; break;
    case 'downloading': upd.busy = true; upd.msg = `Downloading update... ${o.progress}%`; break;
    case 'installing': upd.msg = 'Installing...'; break;
    case 'confirm': upd.msg = 'Tap Update on the Android prompt to finish.'; break;
    case 'permission': upd.msg = 'Allow Naughty Night to install apps, then come back. The update carries on by itself.'; break;
    case 'installed': upd.busy = false; upd.info = null; upd.msg = 'Updated. Reopen the app.'; break;
    case 'error': upd.busy = false; upd.msg = (upd.auto && !upd.info) ? '' : o.message; break;
  }
  if (o.state === 'available' || o.state === 'current') upd.auto = false;
  drawUpd();
};
function drawUpd() {
  const ban = $('#updBanner');
  if (ban) {
    if (upd.busy) ban.innerHTML = `<div class="banner"><span>${esc(upd.msg)}</span></div>`;
    else if (upd.info) ban.innerHTML = `<div class="banner"><span>Update ${esc(upd.info.version)} is ready</span><button id="banGo">Install</button></div>`;
    else ban.innerHTML = '';
    const b = $('#banGo'); if (b) b.onclick = updInstall;
  }
  if (!$('#updPanel')) return;
  $('#updMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === upd.mode));
  $('#updCh').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === upd.channel));
  $('#updHelp').textContent = {
    auto: 'Checks each time the app opens, downloads new versions by itself and asks you to confirm the install.',
    notify: 'Checks each time the app opens and shows a banner. You choose when to install.',
    manual: 'Never checks by itself. Use the button below.'
  }[upd.mode] + (upd.channel === 'beta' ? ' Beta gets pre-release builds first.' : '');
  $('#updMsg').textContent = upd.msg;
  $('#updNow').textContent = upd.info && !upd.busy ? `Install version ${upd.info.version}` : 'Check for updates now';
  $('#updNow').onclick = upd.info && !upd.busy ? updInstall : () => updCheck(false);
  $('#updNow').disabled = upd.busy;
}

route();
if (hasNN() && upd.mode !== 'manual') setTimeout(() => updCheck(true), 1200);
</script>
</body>
</html>
